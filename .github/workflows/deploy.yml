name: Deploy to DOKS

# Reusable workflow — called from each of the 7 service repos'
# publish job via `uses: DigSigna/platform-infra/.github/workflows/deploy.yml@main`
# with `secrets: inherit`. The 3 DOKS_* secrets are set identically as
# plain repo secrets on each of the 7 service repos, NOT as a single
# organization secret: GitHub's docs say "Organization-level secrets
# and variables are not accessible by private repositories for GitHub
# Free," and all 7 service repos are private — confirmed the hard way
# (first run failed with "Secret DOKS_API_SERVER is required, but not
# provided while calling" even though the org secret's access list
# correctly included the repo). One place to fix/improve the rollout
# *logic* instead of seven copies drifting apart; the secret *values*
# still need updating in all 7 places if they ever rotate.
#
# `environment: production` has to live here, not in the calling
# job — GitHub's own docs: "The job that calls the reusable workflow
# can't use the `environment` keyword." No required-reviewers rule is
# attached to it: that protection also needs GitHub Team/Enterprise for
# a private repo's environment (confirmed via the API — 422 "Please
# ensure the billing plan supports the required reviewers protection
# rule" on verification-service). This repo is public, so the rule
# works here, but it was dropped for consistency rather than gating
# some deploys and not others depending on which repo's environment
# GitHub actually evaluates. `environment: production` is kept anyway
# purely for deployment history/visibility in each repo's Deployments
# tab. The actual gate before a deploy fires is PR review + merge to
# main.

on:
  workflow_call:
    inputs:
      service:
        description: >-
          Service name — must match both the Deployment name and the
          container name inside it in k8s/deployments/<service>.yaml,
          and the GHCR image repo name each service's publish job
          pushes to (ghcr.io/digsigna/<service>).
        required: true
        type: string
      tag:
        description: Image tag to roll out, e.g. "1.0.42".
        required: true
        type: string
    secrets:
      DOKS_API_SERVER:
        required: true
      DOKS_CA_CERT:
        required: true
      DOKS_CI_TOKEN:
        required: true

jobs:
  deploy:
    name: Roll out ${{ inputs.service }}:${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure kubectl with the ci-deployer ServiceAccount
        env:
          DOKS_API_SERVER: ${{ secrets.DOKS_API_SERVER }}
          DOKS_CA_CERT: ${{ secrets.DOKS_CA_CERT }}
          DOKS_CI_TOKEN: ${{ secrets.DOKS_CI_TOKEN }}
        run: |
          set -euo pipefail
          echo "$DOKS_CA_CERT" | base64 -d > "$RUNNER_TEMP/doks-ca.crt"
          kubectl config set-cluster doks \
            --server="$DOKS_API_SERVER" \
            --certificate-authority="$RUNNER_TEMP/doks-ca.crt" \
            --embed-certs=true
          kubectl config set-credentials ci-deployer --token="$DOKS_CI_TOKEN"
          kubectl config set-context doks \
            --cluster=doks --user=ci-deployer --namespace=digsigna
          kubectl config use-context doks

      - name: Update image
        run: |
          kubectl set image "deployment/${{ inputs.service }}" \
            "${{ inputs.service }}=ghcr.io/digsigna/${{ inputs.service }}:${{ inputs.tag }}" \
            -n digsigna

      - name: Wait for rollout
        run: |
          kubectl rollout status "deployment/${{ inputs.service }}" \
            -n digsigna --timeout=120s
