# Migrado desde softhsm/k8s/mysql-secrets.example.yaml. Referencia de
# shape, no se aplica directo. Nombre del Secret (`mysql-secrets`) y el
# campo `connection_string` son fijos: hsm-service-rbac (repo softhsm,
# todavía no migrado) y k8s/jobs/migrations-job.yaml dependen de este
# nombre exacto.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: digsigna
type: Opaque
stringData:
  # DSN completo esperado por golang-migrate y por hsm-service (y, a
  # futuro, por cualquier otro de los 7 servicios que hable Go -- los
  # servicios Python usan su propia variable DB_URL/DATABASE_URL, ver
  # k8s/manifests/ y docs/env-vars-inventory.md).
  # Formato: mysql://usuario:password@tcp(host:puerto)/nombre_db?parametros
  connection_string: "mysql://REPLACE_USER:REPLACE_PASSWORD@tcp(REPLACE_HOST:3306)/digsigna?tls=true"
