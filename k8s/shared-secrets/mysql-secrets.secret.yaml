# Migrado desde softhsm/k8s/mysql-secrets.example.yaml. Referencia de
# shape, no se aplica directo. Nombre del Secret (`mysql-secrets`) son
# fijos: k8s/rbac/hsm-service-rbac.yaml y k8s/jobs/migrations-job.yaml
# dependen de este nombre exacto. Dos campos, NO uno -- confirmado leyendo
# el código real de hsm-service (internal/infrastructure/database/parse.go,
# mismo archivo copiado en audit-service):
#
#   - connection_string: formato golang-migrate/go-sql-driver DSN clásico,
#     con tcp(host:puerto) explícito. Lo usa k8s/jobs/migrations-job.yaml
#     (golang-migrate identifica el driver por el scheme "mysql://" y pasa
#     el resto tal cual a go-sql-driver, que SÍ espera tcp(...)).
#   - database_url: mismo host/usuario/password/db, pero como URL estándar
#     (host:puerto SIN tcp(...)) -- lo usa k8s/deployments/hsm-service.yaml
#     (DATABASE_URL). El parser propio de hsm-service hace url.Parse()
#     directo sobre cualquier string que empiece con "mysql://" y arma el
#     tcp(...) él mismo después; si ya viene envuelto en tcp(...) url.Parse
#     rompe con "invalid port after host" (bug real que esto evita).
#
# Si hablás de un servicio Go nuevo, confirmá cuál de los dos formatos
# espera su propio parser antes de asumir que connection_string le sirve
# tal cual -- NO son intercambiables.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: digsigna
type: Opaque
stringData:
  # Formato: mysql://usuario:password@tcp(host:puerto)/nombre_db?parametros
  connection_string: "mysql://REPLACE_USER:REPLACE_PASSWORD@tcp(REPLACE_HOST:3306)/digsigna?tls=true"
  # Formato: mysql://usuario:password@host:puerto/nombre_db?parametros
  database_url: "mysql://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:3306/digsigna?tls=true"
