# NUEVO -- Keycloak no vivía en ningún manifiesto de este repo todavía (ver
# k8s/README.md, sección de gaps). Referencia de shape, no se aplica
# directo con `kubectl apply -f` sobre este archivo -- aplicar a mano con
# `kubectl create secret generic keycloak-secrets --from-literal=... -n digsigna`,
# mismo criterio operativo que mysql-secrets/hsm-secrets (valores que vienen
# de una decisión/generación manual, no de un script de este repo).
#
# Pre-requisito nuevo en la MySQL gestionada, antes de aplicar
# k8s/deployments/keycloak.yaml: un esquema "keycloak" propio (NO el
# esquema "digsigna" compartido por los 7 servicios) + un usuario con
# privilegios ahí. migrations/scripts/setup-db-users.sh no cubre esto --
# sus GRANT son todos sobre `digsigna.*` únicamente. A mano, contra la
# misma instancia que ya usa mysql-secrets:
#
#   CREATE DATABASE IF NOT EXISTS keycloak;
#   CREATE USER IF NOT EXISTS 'keycloak'@'%' IDENTIFIED BY '<db-password>';
#   GRANT ALL PRIVILEGES ON keycloak.* TO 'keycloak'@'%';
#   FLUSH PRIVILEGES;
#
# (Keycloak gestiona su propio esquema interno vía Liquibase al arrancar
# con `start --db=mysql` -- no hace falta correr ninguna migración de este
# repo contra él, solo que la base vacía y el usuario ya existan.)
#
# admin-username/admin-password bootstrapean el usuario del realm "master"
# (KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD en el Deployment) -- deben
# coincidir EXACTAMENTE con KEYCLOAK_ADMIN_USER/KEYCLOAK_ADMIN_PASSWORD del
# Secret identification-service-env (k8s/manifests/identification-service.secret.yaml),
# ya que admin-client.js autentica contra ese mismo usuario vía admin-cli
# para crear/gestionar realms (createTenant -- ver create-tenant.js). Son
# el mismo valor en dos Secrets distintos, generar una vez y copiar a
# ambos lados -- no hay automatización todavía que los sincronice.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: keycloak
type: Opaque
stringData:
  admin-username: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  admin-password: "<GENERADO-NO-COMMITEAR-VALOR-REAL -- copiar también a identification-service-env.KEYCLOAK_ADMIN_PASSWORD>"
  db-url: "jdbc:mysql://REPLACE_HOST:3306/keycloak?useSSL=true&requireSSL=true"
  db-username: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  db-password: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
