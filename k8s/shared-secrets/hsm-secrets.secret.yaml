# Migrado desde softhsm/k8s/hsm-secrets.yaml (ver docs/plan.md /
# STRUCTURE.md: softhsm/k8s/ acumulaba responsabilidades ajenas a ese repo).
# Referencia de shape, no se aplica directo con `kubectl apply -f` sobre
# este archivo -- generar/rotar vía script (ver k8s/README.md) o a mano con
# `kubectl create secret generic hsm-secrets --from-literal=... -n digsigna`,
# nunca con los valores que están escritos acá.
#
# Nombre del Secret (`hsm-secrets`) y namespace son fijos --
# k8s/rbac/hsm-service-rbac.yaml restringe el Role del ServiceAccount de
# hsm-service a leer exactamente los Secrets `hsm-secrets` y
# `mysql-secrets` por nombre. Cambiar el nombre acá rompe ese RBAC si no se
# actualiza en conjunto.
#
# Campos confirmados en uso real, leyendo código real de hsm-service
# (internal/application/services/slot_service.go,
# internal/infrastructure/config/app_config.go) y
# k8s/deployments/hsm-service.yaml:
#   - pin:      HSM_PIN del contenedor principal (Go) -- usado tanto para
#               abrir sesiones PKCS#11 como PIN del propio InitToken al
#               provisionar el slot de un tenant (slot_service.go:181,
#               `p.InitToken(slot, s.config.Pin, label)`).
#   - master-aes-key-v1: HSM_AESKEYMANAGER_K8S_MASTER_KEY_KEY apunta a este
#               nombre de campo -- es la master key AES vigente.
#   - master-key-old:    HSM_AESKEYMANAGER_K8S_OLD_MASTER_KEY_KEY -- master
#               key anterior, para rotación. Vacío si nunca se rotó.
#   - master-key-id:     HSM_AESKEYMANAGER_K8S_KEY_ID lee este campo -- su
#               valor es un identificador lógico (hoy literalmente el string
#               "master-aes-key-v1"), no la key en sí.
#
# Campos SIN consumidor real confirmado -- desface de información
# detectado al leer hsm-service/docker-compose.dev.yml y el código real
# (no asumido), corrigiendo una confirmación anterior de esta misma ronda
# de trabajo que se basó en el script VIEJO (softhsm/k8s/init-token-if-empty.sh,
# todavía baked en la imagen ghcr.io/digsigna/softhsm/softhsm:1.0.0 porque
# softhsm/Dockerfile nunca se actualizó, pero ya no se invoca desde el
# Deployment de este repo -- ver k8s/deployments/hsm-service.yaml):
#   - so-pin:      NO hay ningún SO-PIN en el código Go de hsm-service --
#                  grep de "so.pin|SO_PIN|InitToken" en todo el repo
#                  confirma que InitToken solo usa el PIN normal. El único
#                  consumidor real era el script viejo
#                  (`softhsm2-util --init-token --so-pin`), y
#                  hsm-service/config/init-token-if-empty.sh (la versión
#                  vigente, usada en dev) ya es un no-op: "slots are
#                  provisioned per-tenant via POST /internal/hsm/slots/initialize",
#                  sin SO-PIN en absoluto.
#   - master-key y v1 (sin `-aes-key-v1`/`-id`): confirmado contra
#     hsm-service/config/config.production.yaml (fuente de verdad real del
#     repo) que el nombre de campo vigente es "master-aes-key-v1", nunca
#     "master-key" -- ver k8s/configmaps/hsm-service-config.yaml.
# Se preservan los 3 acá igual, por las dudas de que algo no revisado los
# lea -- candidatos a limpiar en una pasada futura si se confirma que nada
# los usa (ahora con más certeza que antes: so-pin ya no tiene ningún
# consumidor ni siquiera indirecto dentro de este repo).
apiVersion: v1
kind: Secret
metadata:
  name: hsm-secrets
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: hsm-service
type: Opaque
stringData:
  pin: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  master-aes-key-v1: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  master-key-old: "" # vacío hasta la primera rotación
  master-key-id: "master-aes-key-v1" # identificador lógico, no un secreto
  # Vestigiales, sin consumidor confirmado -- ver nota arriba.
  so-pin: "<VESTIGIAL-VER-COMENTARIO-ARRIBA>"
  master-key: "<VESTIGIAL-VER-COMENTARIO-ARRIBA>"
  v1: "<VESTIGIAL-VER-COMENTARIO-ARRIBA>"
