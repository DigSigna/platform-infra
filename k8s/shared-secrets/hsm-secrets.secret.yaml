# Migrado desde softhsm/k8s/hsm-secrets.yaml (ver docs/plan.md /
# STRUCTURE.md: softhsm/k8s/ acumulaba responsabilidades ajenas a ese repo).
# Referencia de shape, no se aplica directo con `kubectl apply -f` sobre
# este archivo -- generar/rotar vía script (ver k8s/README.md) o a mano con
# `kubectl create secret generic hsm-secrets --from-literal=... -n digsigna`,
# nunca con los valores que están escritos acá.
#
# Nombre del Secret (`hsm-secrets`) y namespace son fijos -- hsm-service-rbac
# (en el repo softhsm, todavía no migrado) restringe el Role del
# ServiceAccount de hsm-service a leer exactamente los Secrets
# `hsm-secrets` y `mysql-secrets` por nombre. Cambiar el nombre acá rompe
# ese RBAC si no se actualiza en conjunto.
#
# Todos los campos abajo están confirmados en uso real, leyendo
# softhsm/k8s/hsm-sidecar-deployment.yaml (Deployment real de hsm-service):
#   - pin:      USER_PIN del init-container (softhsm2-util --init-token) Y
#               HSM_PIN del contenedor principal (Go). Mismo valor, dos
#               consumidores.
#   - so-pin:   SO_PIN del init-container únicamente (softhsm2-util
#               --init-token --so-pin). La app Go nunca lee un SO-PIN.
#   - master-aes-key-v1: HSM_AESKEYMANAGER_K8S_MASTER_KEY_KEY apunta a este
#               nombre de campo -- es la master key AES vigente.
#   - master-key-old:    HSM_AESKEYMANAGER_K8S_OLD_MASTER_KEY_KEY -- master
#               key anterior, para rotación. Vacío si nunca se rotó.
#   - master-key-id:     HSM_AESKEYMANAGER_K8S_KEY_ID lee este campo -- su
#               valor es un identificador lógico (hoy literalmente el string
#               "master-aes-key-v1"), no la key en sí.
#
# Campos `master-key` y `v1` (sin `-aes-key-v1`/`-id`): NO se encontró
# ningún consumidor real en hsm-service ni en los manifiestos de softhsm
# revisados -- el ConfigMap hsm-service-config.yaml de softhsm tiene
# `master_key_key: "master-key"`, pero el Deployment real pisa ese valor
# con la env var HSM_AESKEYMANAGER_K8S_MASTER_KEY_KEY="master-aes-key-v1"
# (que gana, viper prioriza env sobre YAML) -- es decir, `master-key` es un
# campo vestigial de una config inconsistente que nunca se usó de verdad.
# Se preservan acá igual, por las dudas de que algo no revisado los lea --
# candidatos a limpiar en una pasada futura si se confirma que nada los usa.
apiVersion: v1
kind: Secret
metadata:
  name: hsm-secrets
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: hsm-service
type: Opaque
stringData:
  pin: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  so-pin: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  master-aes-key-v1: "<GENERADO-NO-COMMITEAR-VALOR-REAL>"
  master-key-old: "" # vacío hasta la primera rotación
  master-key-id: "master-aes-key-v1" # identificador lógico, no un secreto
  # Vestigiales, sin consumidor confirmado -- ver nota arriba.
  master-key: "<VESTIGIAL-VER-COMENTARIO-ARRIBA>"
  v1: "<VESTIGIAL-VER-COMENTARIO-ARRIBA>"
