# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh certificate-service desde
# k8s/envs/certificate-service.env (gitignored). AUDIT_API_KEY vive aparte
# en k8s/service-keys/certificate-service.secret.yaml.
#
# HSM_SERVICE_BASE_URL / IDENTITY_SERVICE_BASE_URL no necesitan su propia
# API key: certificate-service reenvía el JWT del caller original tal cual
# hacia esos dos servicios (confirmado leyendo el código, ver
# docs/env-vars-inventory.md) -- no hay credencial de servicio-a-servicio
# que generar para esas dos llamadas.
#
# AUTH_ISSUER/AUTH_AUDIENCE: faltaban en una pasada anterior -- sin
# fijarlas, JWTValidatorAdapter (py-common) acepta cualquier issuer/
# audience (más laxo de lo real, confirmado en
# certificate-service/app/main.py + docker-compose.dev.yml).
apiVersion: v1
kind: Secret
metadata:
  name: certificate-service-env
  namespace: digsigna
type: Opaque
stringData:
  DB_URL: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
  HSM_SERVICE_BASE_URL: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
  IDENTITY_SERVICE_BASE_URL: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
  AUTH_JWKS_URL: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
  AUTH_ISSUER: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
  AUTH_AUDIENCE: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
  AUDIT_HTTP_BASE_URL: "<DESDE-k8s-envs-certificate-service.env-NO-COMMITEAR>"
