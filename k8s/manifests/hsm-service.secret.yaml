# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh hsm-service desde
# k8s/envs/hsm-service.env (gitignored).
#
# NO incluye HSM_PIN ni la master key: esas vienen de
# k8s/shared-secrets/hsm-secrets.secret.yaml vía secretKeyRef directo en el
# Deployment (confirmado en softhsm/k8s/hsm-sidecar-deployment.yaml -- el
# patrón real ya existente, no uno nuevo inventado acá). Tampoco incluye
# AUDIT_API_KEY (k8s/service-keys/hsm-service.secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: hsm-service-env
  namespace: digsigna
type: Opaque
stringData:
  HSM_LIBRARY_PATH: "<DESDE-k8s-envs-hsm-service.env-NO-COMMITEAR>"
  HSM_TOKEN_LABEL: "<DESDE-k8s-envs-hsm-service.env-NO-COMMITEAR>"
  HSM_AUTH_PUBLIC_KEY_PATH: "<DESDE-k8s-envs-hsm-service.env-NO-COMMITEAR>"
  HSM_AUTH_JWKS_URL: "<DESDE-k8s-envs-hsm-service.env-NO-COMMITEAR>"
  HSM_AUDIT_HTTP_BASE_URL: "<DESDE-k8s-envs-hsm-service.env-NO-COMMITEAR>"
