# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh audit-service desde
# k8s/envs/audit-service.env (gitignored).
#
# No confundir con k8s/service-keys/audit-service.secret.yaml (las 6
# AUDIT_KEY_<SERVICIO> que audit-service usa para VALIDAR productores) --
# este archivo es para las demás variables de audit-service: su propia
# base de datos y su propia validación de JWT de usuario final (endpoints
# que no son POST /api/v1/events).
#
# NO incluye AUDIT_AUTH_PUBLIC_KEY_PATH -- estaba acá antes de escribir
# k8s/deployments/audit-service.yaml, pero sin consumidor real en modo
# production: go-common/auth/key_manager.go's loadInitialKeys() solo lee
# PublicKeyPath cuando Mode == ModeDevelopment, nunca en production (usa
# JWKSUrl exclusivamente) -- mismo gap ya corregido para
# HSM_AUTH_PUBLIC_KEY_PATH en k8s/deployments/hsm-service.yaml. AUDIT_AUTH_MODE/
# AUDIT_ENVIRONMENT/AUDIT_CONFIG_PATH tampoco van acá -- son constantes
# fijas, puestas directo como `value:` en el Deployment, no en este Secret.
apiVersion: v1
kind: Secret
metadata:
  name: audit-service-env
  namespace: digsigna
type: Opaque
stringData:
  DATABASE_URL: "<DESDE-k8s-envs-audit-service.env-NO-COMMITEAR>"
  AUDIT_AUTH_JWKS_URL: "<DESDE-k8s-envs-audit-service.env-NO-COMMITEAR>"
