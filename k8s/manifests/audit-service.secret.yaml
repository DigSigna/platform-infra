# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh audit-service desde
# k8s/envs/audit-service.env (gitignored).
#
# No confundir con k8s/service-keys/audit-service.secret.yaml (las 6
# AUDIT_KEY_<SERVICIO> que audit-service usa para VALIDAR productores) --
# este archivo es para las demás variables de audit-service: su propia
# base de datos y su propia validación de JWT de usuario final (endpoints
# que no son POST /api/v1/events).
apiVersion: v1
kind: Secret
metadata:
  name: audit-service-env
  namespace: digsigna
type: Opaque
stringData:
  DATABASE_URL: "<DESDE-k8s-envs-audit-service.env-NO-COMMITEAR>"
  AUDIT_AUTH_PUBLIC_KEY_PATH: "<DESDE-k8s-envs-audit-service.env-NO-COMMITEAR>"
  AUDIT_AUTH_JWKS_URL: "<DESDE-k8s-envs-audit-service.env-NO-COMMITEAR>"
