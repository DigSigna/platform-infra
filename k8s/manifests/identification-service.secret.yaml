# Referencia de shape -- no se aplica con `kubectl apply -f` sobre este
# archivo. El Secret real se genera con
# `kubectl create secret generic identification-service-env --from-env-file=k8s/envs/identification-service.env -n digsigna`
# (ver scripts/apply-service-env-secrets.sh y k8s/README.md), a partir de
# k8s/envs/identification-service.env (gitignored, copiado de
# identification-service.env.example con valores reales).
#
# No incluye AUDIT_API_KEY (ese vive en
# k8s/service-keys/identification-service.secret.yaml, mecanismo aparte).
#
# JWT_SIGNING_KEYS_DIR: reemplaza el plan anterior de Secret +
# JWT_PRIVATE_KEY_PATH/JWT_PUBLIC_KEY_PATH -- ese modo desactivaba la
# rotación real que el código ya soporta (ver
# k8s/storage/identification-service-jwt-keys-pvc.yaml para el detalle
# completo). NO fijar JWT_PRIVATE_KEY_PATH/JWT_PUBLIC_KEY_PATH -- su sola
# presencia activa el modo de llave fija sin rotación.
apiVersion: v1
kind: Secret
metadata:
  name: identification-service-env
  namespace: digsigna
type: Opaque
stringData:
  DB_URL: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  KEYCLOAK_BASE_URL: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  KEYCLOAK_ADMIN_USER: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  KEYCLOAK_ADMIN_PASSWORD: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  BOOTSTRAP_SECRET: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  HSM_SERVICE_URL: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  CERTIFICATE_SERVICE_URL: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  AUDIT_SERVICE_URL: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  REDIS_URL: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  ALLOWED_ORIGINS: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  JWT_ISSUER: "<DESDE-k8s-envs-identification-service.env-NO-COMMITEAR>"
  JWT_SIGNING_KEYS_DIR: "/var/lib/identification-service/jwt-keys"
