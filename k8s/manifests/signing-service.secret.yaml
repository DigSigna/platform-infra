# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh signing-service desde
# k8s/envs/signing-service.env (gitignored). AUDIT_API_KEY vive aparte en
# k8s/service-keys/signing-service.secret.yaml.
#
# HSM_SERVICE_BASE_URL / CERTIFICATE_SERVICE_BASE_URL: mismo criterio que
# certificate-service -- JWT pass-through del caller, sin API key propia.
#
# REDIS_*: faltaban en una pasada anterior. El inventario solo había
# señalado este patrón para verification-service, pero signing-service lo
# tiene igual -- confirmado en app/interfaces/routes/health.py: GET
# /health llama check_redis() de forma INCONDICIONAL (no depende de
# AUTH_TOKEN_CACHE_ENABLED), así que sin esto el healthcheck del pod
# siempre reporta status "degraded" aunque el token-cache esté
# deshabilitado. Sin resolver qué Redis usar (uno dedicado vs reusar
# k8s/deployments/redis-gateway.yaml) -- ver gap en k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: signing-service-env
  namespace: digsigna
type: Opaque
stringData:
  DB_URL: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  HSM_SERVICE_BASE_URL: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  CERTIFICATE_SERVICE_BASE_URL: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  AUTH_JWKS_URL: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  AUDIT_HTTP_BASE_URL: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  REDIS_HOST: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  REDIS_PORT: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  REDIS_PASSWORD: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
  REDIS_DB: "<DESDE-k8s-envs-signing-service.env-NO-COMMITEAR>"
