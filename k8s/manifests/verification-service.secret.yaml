# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh verification-service desde
# k8s/envs/verification-service.env (gitignored). AUDIT_API_KEY vive aparte
# en k8s/service-keys/verification-service.secret.yaml.
#
# CERTIFICATE_SERVICE_BASE_URL apunta a endpoints PÚBLICOS de
# certificate-service (GET /public/ca-bundle, GET /public/certificates/status)
# -- confirmado que ese cliente nunca manda ningún header de auth, por
# diseño. No hace falta ninguna credencial para esa llamada.
apiVersion: v1
kind: Secret
metadata:
  name: verification-service-env
  namespace: digsigna
type: Opaque
stringData:
  DB_URL: "<DESDE-k8s-envs-verification-service.env-NO-COMMITEAR>"
  CERTIFICATE_SERVICE_BASE_URL: "<DESDE-k8s-envs-verification-service.env-NO-COMMITEAR>"
  AUTH_JWKS_URL: "<DESDE-k8s-envs-verification-service.env-NO-COMMITEAR>"
  AUDIT_HTTP_BASE_URL: "<DESDE-k8s-envs-verification-service.env-NO-COMMITEAR>"
