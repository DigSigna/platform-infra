# Referencia de shape -- no se aplica directo. Generado vía
# scripts/apply-service-env-secrets.sh gateway-service desde
# k8s/envs/gateway-service.env (gitignored). AUDIT_API_KEY vive aparte en
# k8s/service-keys/gateway-service.secret.yaml.
#
# GATEWAY_REDIS_ADDRESS: confirmado que /ready ya depende de un PING real a
# Redis cuando esta variable está seteada (si falta, cae a rate-limit en
# memoria y el check de Redis en /ready pasa trivialmente sin significar
# nada -- ver docs/env-vars-inventory.md). Hace falta un Redis real
# desplegado antes de fijar esta variable; desplegar ese Redis está FUERA
# de alcance de este repo por ahora (no hay Deployment de ningún servicio
# acá todavía, ver k8s/README.md) -- señalado como gap pendiente.
# Este Redis no usa AUTH (sin password) en ningún entorno confirmado.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-service-env
  namespace: digsigna
type: Opaque
stringData:
  GATEWAY_AUTH_JWKS_URL: "<DESDE-k8s-envs-gateway-service.env-NO-COMMITEAR>"
  GATEWAY_REDIS_ADDRESS: "<DESDE-k8s-envs-gateway-service.env-NO-COMMITEAR>"
  GATEWAY_AUDIT_HTTP_BASE_URL: "<DESDE-k8s-envs-gateway-service.env-NO-COMMITEAR>"
