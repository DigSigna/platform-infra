# Par RSA que identification-service usa para firmar JWT (RS256). Hoy, sin
# JWT_PRIVATE_KEY_PATH/JWT_PUBLIC_KEY_PATH configurados, el servicio genera
# un par efímero en memoria al boot -- en k8s eso invalida todos los tokens
# activos en cada restart de pod (gap confirmado en
# docs/env-vars-inventory.md). Este Secret resuelve eso: se monta como
# volumen de archivos, no como variables de entorno sueltas.
#
# Generar/rotar vía scripts/generate-identification-jwt-keys.sh (openssl
# genrsa, nunca escribe la clave privada en ningún archivo del repo).
#
# El Deployment de identification-service (fuera del alcance de este repo
# por ahora -- no existe todavía ningún Deployment acá, ver k8s/README.md)
# debe montar este Secret como volumen y apuntar
# JWT_PRIVATE_KEY_PATH=/etc/identification-service/jwt/private.pem y
# JWT_PUBLIC_KEY_PATH=/etc/identification-service/jwt/public.pem a ese mount.
apiVersion: v1
kind: Secret
metadata:
  name: identification-service-jwt-keys
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: identification-service
type: Opaque
stringData:
  private.pem: "<GENERADO-POR-SCRIPT-NO-COMMITEAR-VALOR-REAL>"
  public.pem: "<GENERADO-POR-SCRIPT-NO-COMMITEAR-VALOR-REAL>"
