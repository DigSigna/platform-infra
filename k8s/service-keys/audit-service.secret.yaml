# A diferencia de los otros 6 archivos de este directorio, audit-service no
# es productor de eventos de auditoría -- es quien los recibe y valida. Por
# eso este Secret tiene una forma distinta: no un solo campo `api_key`, sino
# un campo por cada productor conocido, con el MISMO valor que el Secret
# `<servicio>-audit-key` de ese productor (ver los otros 6 archivos de este
# directorio y docs/service-key-map.md) -- nunca una key nueva, es el mismo
# valor montado dos veces con dos nombres de variable distintos (uno en el
# pod del productor, otro acá).
#
# Referencia de shape, no se aplica directo. El valor real de cada campo se
# copia manualmente (o vía script, ver k8s/README.md) desde el Secret del
# productor correspondiente al momento de generarlo/rotarlo -- nunca se
# inventa un valor nuevo acá.
#
# audit-service lee estos valores como variables de entorno
# AUDIT_KEY_<SERVICIO> (una por productor, ver internal/infrastructure/
# config/app_config.go::loadServiceKeys en el repo audit-service -- escanea
# el prefijo AUDIT_KEY_ en el entorno, no es una lista fija en código, así
# que agregar un productor nuevo es solo una key nueva acá + su env var).
apiVersion: v1
kind: Secret
metadata:
  name: audit-service-producer-keys
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: audit-service
  annotations:
    digsigna.io/permission: "audit-service:events:validate"
type: Opaque
stringData:
  # Mismo valor que hsm-service-audit-key/api_key
  AUDIT_KEY_HSM_SERVICE: "<MISMO-VALOR-QUE-hsm-service-audit-key-NO-COMMITEAR>"
  # Mismo valor que certificate-service-audit-key/api_key
  AUDIT_KEY_CERTIFICATE_SERVICE: "<MISMO-VALOR-QUE-certificate-service-audit-key-NO-COMMITEAR>"
  # Mismo valor que signing-service-audit-key/api_key
  AUDIT_KEY_SIGNING_SERVICE: "<MISMO-VALOR-QUE-signing-service-audit-key-NO-COMMITEAR>"
  # Mismo valor que identification-service-audit-key/api_key
  AUDIT_KEY_IDENTIFICATION_SERVICE: "<MISMO-VALOR-QUE-identification-service-audit-key-NO-COMMITEAR>"
  # Mismo valor que verification-service-audit-key/api_key
  AUDIT_KEY_VERIFICATION_SERVICE: "<MISMO-VALOR-QUE-verification-service-audit-key-NO-COMMITEAR>"
  # Mismo valor que gateway-service-audit-key/api_key. Campo nuevo -- no
  # documentado en el plan original, confirmado leyendo el código real de
  # audit-service (ya tiene AUDIT_KEY_API_GATEWAY wireado en su propio
  # docker-compose.dev.yml) y de gateway-service (ya envía el header).
  AUDIT_KEY_API_GATEWAY: "<MISMO-VALOR-QUE-gateway-service-audit-key-NO-COMMITEAR>"
