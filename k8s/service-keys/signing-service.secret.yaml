# Forma del Secret que scripts/generate-service-keys.sh crea para este
# servicio -- referencia de shape, no se aplica con `kubectl apply -f` sobre
# este archivo (el script usa --from-literal con el valor real generado en
# el momento, nunca lo que esté escrito acá). Ver docs/service-key-map.md
# para namespace/fingerprint vigente.
apiVersion: v1
kind: Secret
metadata:
  name: signing-service-audit-key
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: signing-service
    digsigna.io/produced-for: audit-service
  annotations:
    digsigna.io/permission: "audit-service:events:write"
type: Opaque
stringData:
  api_key: "<GENERADO-POR-SCRIPT-NO-COMMITEAR-VALOR-REAL>"
