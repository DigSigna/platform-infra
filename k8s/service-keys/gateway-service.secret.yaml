# Forma del Secret que scripts/generate-service-keys.sh crea para este
# servicio -- referencia de shape, no se aplica con `kubectl apply -f` sobre
# este archivo (el script usa --from-literal con el valor real generado en
# el momento, nunca lo que esté escrito acá). Ver docs/service-key-map.md
# para namespace/fingerprint vigente.
#
# api-gateway (repo gateway-service) ya es un productor real de eventos de
# auditoría hoy -- confirmado leyendo su código (manda X-Service-API-Key a
# audit-service para rechazos de JWT y bloqueos de rate-limit), aunque el
# plan original de este repo decía "api-gateway todavía no existe". Este
# archivo estaba vacío porque se creó antes de confirmar eso -- ver
# docs/env-vars-inventory.md.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-service-audit-key
  namespace: digsigna
  labels:
    digsigna.io/consumed-by: gateway-service
    digsigna.io/produced-for: audit-service
  annotations:
    digsigna.io/permission: "audit-service:events:write"
type: Opaque
stringData:
  api_key: "<GENERADO-POR-SCRIPT-NO-COMMITEAR-VALOR-REAL>"
