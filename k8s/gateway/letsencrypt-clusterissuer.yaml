# Movido de k8s/ingress/letsencrypt-clusterissuer.yaml (migración a
# Gateway API, ver docs/ingress-migration-plan.md) -- mismo
# ClusterIssuer, mismo certificado ya emitido (Secret `gateway-tls`, no se
# forzó reemisión), solo cambia el solver.
#
# http01.ingress -> http01.gatewayHTTPRoute: antes el challenge se resolvía
# creando un Ingress temporal contra ingress-nginx; ahora cert-manager crea
# un HTTPRoute temporal colgado del Gateway `gateway` (ver gateway.yaml en
# este mismo directorio) para responder el challenge ACME HTTP-01. No
# depende de un Service type LoadBalancer ni de un webhook de DNS del
# proveedor, igual que antes.
#
# Sin urgencia al migrar (2026-11-20): el certificado vigente no vence
# hasta 2027-02-01, cert-manager renueva solo ~30 días antes -- este
# cambio de solver solo importa para ESA renovación futura, no se disparó
# ningún challenge nuevo en la migración.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ray.torres.dev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: gateway
            namespace: digsigna
            sectionName: http
