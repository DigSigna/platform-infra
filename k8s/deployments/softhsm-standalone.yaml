# Migrado desde softhsm/k8s/softhsm-standalone.yaml. Namespace agregado
# explícito -- sin otros cambios.
#
# FLAG, no resuelto acá: este Deployment parece ser un duplicado de testing
# de la arquitectura real (hsm-service corre su propio SoftHSM como
# init-container + sidecar en k8s/deployments/hsm-service.yaml -- ver
# comentario ahí). Este manifiesto:
#   - usa `image: softhsm:latest` (genérico, no ghcr.io/digsigna/...)
#   - hardcodea HSM_USER_PIN/HSM_SO_PIN en texto plano como env vars en vez
#     de leerlos de hsm-secrets
#   - usa emptyDir en vez del PVC softhsm-pvc (tokens no persisten)
# Ningún otro manifiesto de este repo lo referencia (ni Service, ni
# consumidor). No se encontró evidencia de que se use fuera de pruebas
# locales -- confirmar con el equipo si sigue vigente antes de aplicarlo en
# ningún entorno real; si no, es candidato a borrar.
#
# Adicional: HSM_SO_PIN tampoco tiene consumidor real en el código Go de
# hsm-service (ver nota en k8s/shared-secrets/hsm-secrets.secret.yaml) --
# aunque este Deployment lo use para auto-inicializar un token acá mismo,
# vía su propio softhsm2-util interno, no es el mecanismo real que usa
# hsm-service en producción (API por tenant), así que este manifiesto
# parece ser, como mucho, una herramienta de testing manual aislada.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: softhsm-standalone
  namespace: digsigna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: softhsm
  template:
    metadata:
      labels:
        app: softhsm
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: hsm-tokens
        emptyDir: {}
      containers:
      - name: softhsm
        image: softhsm:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SOFTHSM2_CONF
          value: "/opt/softhsm/config/softhsm2.conf"
        - name: HSM_USER_PIN
          value: "1234"
        - name: HSM_SO_PIN
          value: "5678"
        volumeMounts:
        - name: hsm-tokens
          mountPath: /var/lib/softhsm/tokens
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
