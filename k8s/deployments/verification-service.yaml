# NUEVO -- ver k8s/README.md para el orden sugerido. Depende de
# identification-service al arrancar (mismo fetch síncrono de JWKS que
# certificate-service/signing-service, py_common/auth/key_manager_adapter.py).
# certificate-service solo se usa por request (endpoints públicos de CA
# bundle / estado de revocación), no al boot.
#
# Dos gaps encontrados leyendo el código real (no asumido), ninguno
# estaba en k8s/manifests/verification-service.secret.yaml hasta ahora:
#   1. AUTH_ISSUER/AUTH_AUDIENCE -- mismo gap ya corregido para
#      certificate-service, visto también en signing-service. Fijados
#      acá como constantes literales.
#   2. REDIS_* -- el inventario decía "sin consumo real salvo
#      AUTH_TOKEN_CACHE_ENABLED", pero app/interfaces/routes/health.py es
#      el mismo archivo que signing-service (py_common): GET
#      /api/v1/health llama check_redis() de forma incondicional. Resuelto
#      igual que signing-service, reusando k8s/deployments/redis-gateway.yaml
#      -- ver k8s/manifests/verification-service.secret.yaml.
#
# CONFIG_FILE: mismo criterio que certificate-service/signing-service --
# Dockerfile Python con `COPY . .`, config.yaml ya horneado en la imagen.
#
# Imagen: placeholder REPLACE_VERSION, ver la nota de
# k8s/deployments/identification-service.yaml.
#
# PRE-REQUISITOS: Secret `verification-service-env` (mecanismo 1), Secret
# `verification-service-audit-key` (mecanismo 2),
# `k8s/deployments/redis-gateway.yaml` ya aplicado, `ghcr-creds`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
  namespace: digsigna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verification-service
  template:
    metadata:
      labels:
        app: verification-service
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: verification-service
        image: ghcr.io/digsigna/verification-service:1.0.6
        imagePullPolicy: Always
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: CONFIG_FILE
          value: "/app/config/config.yaml"

        - name: AUTH_MODE
          value: "production"
        - name: AUTH_ISSUER
          value: "identification-service"
        - name: AUTH_AUDIENCE
          value: "verification-service"
        - name: AUTH_TOKEN_CACHE_ENABLED
          value: "false"

        - name: CERTIFICATE_SERVICE_TIMEOUT
          value: "5s"
        - name: CA_BUNDLE_CACHE_TTL_HOURS
          value: "12.0"

        - name: AUDIT_ENABLED
          value: "true"
        - name: AUDIT_STRATEGY
          value: "hybrid"

        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: DB_URL
        - name: CERTIFICATE_SERVICE_BASE_URL
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: CERTIFICATE_SERVICE_BASE_URL
        - name: AUTH_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: AUTH_JWKS_URL
        - name: AUDIT_HTTP_BASE_URL
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: AUDIT_HTTP_BASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: REDIS_PASSWORD
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: verification-service-env
              key: REDIS_DB

        - name: AUDIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: verification-service-audit-key
              key: api_key

        ports:
        - containerPort: 8002
          name: http
          protocol: TCP
        # Mismo caveat que certificate-service/signing-service -- GET
        # /api/v1/health (py_common) siempre devuelve 200.
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8002
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8002
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        resources:
          requests:
            memory: "160Mi"
            cpu: "100m"
            ephemeral-storage: "256Mi"
          limits:
            memory: "320Mi"
            cpu: "300m"
            ephemeral-storage: "512Mi"
---
# Nombre "verification-service" a propósito -- coincide con
# routes.services.verification de gateway-service/config/config.production.yaml
# ("http://verification-service:8002").
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: digsigna
spec:
  selector:
    app: verification-service
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
