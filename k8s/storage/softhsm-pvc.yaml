# Migrado desde softhsm/k8s/softhsm-pvc.yaml. Se agregó namespace
# explícito. storageClassName confirmado contra `kubectl get storageclass`
# en el cluster DOKS real (digsigna-prod-doks, 2026-11-03): el default es
# "do-block-storage" (CSI dobs.csi.digitalocean.com) -- no existe ninguna
# clase llamada "standard" en este cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: softhsm-pvc
  namespace: digsigna
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: do-block-storage
