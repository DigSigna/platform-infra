# ClusterIssuer de Let's Encrypt (producción) para cert-manager. Usa el
# challenge HTTP-01 contra el ingress-nginx ya expuesto en 80/443 vía
# hostNetwork (ver k8s/ingress/gateway-ingress.yaml) -- no depende de un
# Service type LoadBalancer ni de un webhook de DNS del proveedor.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ray.torres.dev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
